[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-memory-vault-tools"
version = "0.1.0"
description = "Local conversation archive, source-grounded memory retrieval, and Pi integration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "chesszyh" }]
dependencies = []

[project.urls]
Repository = "https://github.com/Chesszyh/personal-memory-vault"
Issues = "https://github.com/Chesszyh/personal-memory-vault/issues"

[project.optional-dependencies]
pdf = ["playwright>=1.58,<2"]
semantic = ["sentence-transformers>=5,<6"]

[project.scripts]
personal-vault = "personal_vault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_vault = [
  "schema.sql",
  "reader_static/*.html",
  "reader_static/*.css",
  "reader_static/*.js",
  "reader_static/vendor/*.js",
  "reader_static/vendor/*LICENSE*",
  "memory_review_static/*.html",
  "memory_review_static/*.css",
  "memory_review_static/*.js",
]

[tool.unittest]
start-directory = "tests"
